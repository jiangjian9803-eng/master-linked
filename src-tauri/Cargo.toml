[package]
name = "master-linked"
version = "0.2.0"
description = "Privacy-first outreach workbench"
authors = ["Jian Jiang"]
edition = "2021"

[lib]
name = "master_linked_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
