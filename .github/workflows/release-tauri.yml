name: Release lightweight app

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm install
      - run: npx tauri icon assets/icons/master-linked-1024.png
      - name: Prepare isolated web assets
        shell: bash
        run: |
          rm -rf web
          mkdir -p web
          cp index.html app.js styles.css manifest.webmanifest sw.js web/
          cp -R assets web/assets
      - run: npm run tauri:build
      - uses: actions/upload-artifact@v4
        with:
          name: master-linked-${{ matrix.name }}
          # 仅发布安装包，不把解包后的运行时依赖目录上传到 Releases。
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm

  release:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: master-linked-*
          merge-multiple: true
      - name: Collect installer files
        shell: bash
        run: |
          mkdir -p release-flat
          find release-assets -type f \( \
            -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o \
            -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
          \) -exec cp {} release-flat/ \;
          echo 'Collected installers:'
          find release-flat -maxdepth 1 -type f -printf '%f (%s bytes)\n' | sort
          test "$(find release-flat -maxdepth 1 -type f | wc -l | tr -d ' ')" -ge 3
          test -n "$(find release-flat -maxdepth 1 -type f -name '*.dmg' -size +0c -print -quit)"
          test -n "$(find release-flat -maxdepth 1 -type f \( -name '*.msi' -o -name '*.exe' \) -size +0c -print -quit)"
          test -n "$(find release-flat -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -size +0c -print -quit)"
      - uses: softprops/action-gh-release@v2
        with:
          files: release-flat/*
          generate_release_notes: true
      - name: Verify published release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in {1..10}; do
            count=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
              | jq '.assets | length')
            echo "Release assets detected: $count"
            if [ "$count" -ge 3 ]; then exit 0; fi
            sleep 3
          done
          echo 'Release was created but expected installer assets were not found.'
          exit 1
